<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Map</title>
  </head>
  <body class="font-sans text-gray-900 antialiased" x-data x-init="$store.travel.init()">
    <div class="max-w-6xl mx-auto px-6 md:px-8 py-6 md:py-8">
      <div class="max-w-md mx-auto mb-8 md:mb-10" id="search-input">
        <input
          id="autosuggest__input"
          class="min-h-11 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-base leading-6 w-full placeholder:text-gray-500 outline-none transition-colors hover:border-gray-400 focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/15"
          type="text"
          aria-label="Search by country name"
          autocomplete="off"
          placeholder="Search by country name…"
        />
        <div class="relative w-full">
          <div
            class="absolute top-2 z-10 w-full rounded-lg bg-white border border-gray-200 shadow-lg shadow-gray-900/10 hidden overflow-auto max-h-[200px] p-1"
            id="autosuggest-results"
          >
            <ul id="autosuggest-list" class="list-none p-0 m-0"></ul>
          </div>
        </div>
      </div>

      <div class="max-w-5xl mx-auto mb-8" id="map-container"></div>

      <div class="mb-8">
        <p class="mb-4 flex items-baseline gap-2 tabular-nums">
          <span class="text-sm text-gray-500">Total</span>
          <span class="text-lg font-medium" x-text="$store.travel.selectedCountries.length"></span>
        </p>

        <div class="flex flex-wrap gap-2">
          <template x-for="country in $store.travel.selectedCountries" :key="country.code">
            <button
              type="button"
              class="px-3 py-2 inline-flex items-center gap-1.5 border border-gray-200 bg-gray-100 rounded-full text-sm leading-5 text-gray-700 hover:bg-gray-200 hover:border-gray-300 active:bg-gray-300 transition-colors cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600"
              :aria-label="`Remove ${country.name}`"
              @click="$store.travel.removeCountry(country.code)"
            >
              <span aria-hidden="true" x-text="country.emoji"></span>
              <span x-text="country.name"></span>
              <svg class="h-3 w-3 shrink-0 text-gray-500" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                <path d="m5 5 6 6m0-6-6 6" />
              </svg>
            </button>
          </template>
        </div>
      </div>

      <div class="mb-8" x-cloak x-show="$store.travel.shareUrl">
        <h2 class="text-sm text-gray-500 mb-3">
          Share
        </h2>
        <a
          class="text-gray-700 inline-flex items-center gap-2 max-w-full min-h-11 overflow-hidden leading-6 rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm hover:bg-gray-50 hover:border-gray-400 active:bg-gray-100 transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600"
          :href="$store.travel.shareUrl"
          aria-label="Copy share link"
          title="Copy share link"
          @click.prevent="$store.travel.copyShareUrl()"
        >
          <span class="min-w-0 flex-1 truncate" x-text="$store.travel.shareUrl"></span>
          <svg class="h-4 w-4 text-gray-500 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M8 2a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V6.414a2 2 0 0 0-.586-1.414l-2.414-2.414A2 2 0 0 0 11.586 2H8Zm3.586 1L15 6.414V13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h3.586ZM4 6a1 1 0 0 0-1 1v9a3 3 0 0 0 3 3h6a1 1 0 1 0 0-2H6a1 1 0 0 1-1-1V7a1 1 0 0 0-1-1Z"/>
          </svg>
        </a>
      </div>

      <footer class="text-sm leading-6 text-gray-500">
        <p class="mb-2">
          Made by
          <a href="https://dan.kim" target="_blank" class="footer-link">Dan Kim</a>.
        </p>

        <div class="flex flex-wrap gap-x-3 md:gap-x-4 gap-y-1">
          <a href="https://twitter.com/dankimio" target="_blank" class="footer-link">
            Twitter
          </a>
          <a href="https://www.instagram.com/dankimio/" target="_blank" class="footer-link">
            Instagram
          </a>
          <a href="https://github.com/dankimio" target="_blank" class="footer-link">
            GitHub
          </a>
          <a href="https://github.com/dankimio/travel-map" target="_blank" class="footer-link">
            Source
          </a>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
